name: 部署教学页面到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 测试并构建静态页面
    runs-on: ubuntu-latest
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 验证教学约束
        run: npm test
      - name: 构建生产页面
        run: npm run build
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6
      - name: 上传静态页面
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布教学页面
        id: deployment
        uses: actions/deploy-pages@v5
